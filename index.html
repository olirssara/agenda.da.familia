<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/src/style.css">

  <title>Agenda da Família</title>
</head>

<body>

  <section class="tela-inicial" id="telaInicial">

    <p class="pequeno">NOSSA CASA</p>
  
    <h1>Agenda da Família</h1>
  
    <p class="frase">
      Tudo da nossa família,<br>
      em um só lugar.
    </p>
  
    <button id="abrirAgenda" class="botao-abrir">
      Entrar →
    </button>
  
  </section>

  <main class="agenda escondido">

    <button id="voltarInicio" class="botao-voltar">← Voltar</button>

    <header class="cabecalho">
      <p class="pequeno">NOSSA CASA</p>

      <h1>Agenda da Família</h1>

      <p class="subtitulo">Outubro · 2026</p>
    </header>

    <button id="abrirFamilia" class="botao-familia">
      ...
    </button>

    <section class="calendario" id="calendario">

      <div class="calendario-cabecalho">
        <button id="mesAnterior">‹</button>
    
        <div class="controle-visualizacao">
          <button id="mesAtual">Outubro 2026</button>
        
          <button id="tipoVisualizacao">
            Mês ▾
          </button>
          <div id="menuVisualizacao" class="menu-visualizacao escondido">
            <button data-view="dia">Dia</button>
            <button data-view="semana">Semana</button>
            <button data-view="mes">Mês</button>
            <button data-view="ano">Ano</button>
          </div>
        </div>
    
        <button id="mesProximo">›</button>
      </div>
    
      <div class="dias-semana">
         <span>DOM</span>
         <span>SEG</span>
         <span>TER</span>
         <span>QUA</span>
         <span>QUI</span>
         <span>SEX</span>
         <span>SÁB</span>
      </div>
    
      <div class="grade-calendario" id="gradeCalendario"></div>
    
    </section>


    <button id="botaoAdicionar" class="botao-adicionar" aria-label="Adicionar">
      +
    </button>

      <div id="menuAdicionar" class="menu-adicionar escondido">

         <button data-acao="evento">
           📅 Evento
         </button>
    
         <button data-acao="compra">
           🛒 Compra
         </button>
    
         <button data-acao="cardapio">
           🍽️ Cardápio
         </button>
    
         <button data-acao="pessoa">
           👤 Pessoa
         </button>
    
      </div>


    <div id="formulario" class="formulario escondido">

      <h2>Novo evento</h2>

      <label>
        Nome do evento
        <input id="nomeEvento" type="text" placeholder="Ex: Dentista">
      </label>

      <label>
        Quem vai?
        <select id="pessoaEvento">
           <option value="Diogo">Diogo</option>
           <option value="Iara">Iara</option>
           <option value="Davi">Davi</option>
           <option value="Sofia">Sofia</option>
           <option value="Sara">Sara</option>
           <option value="Benjamim">Benjamim</option>
           <option value="Todos">Todos</option>
        </select>
      </label>

      <label>
        Data
        <input id="dataEvento" type="date">
      </label>

      <label>
        Horário
        <input id="horaEvento" type="time">
      </label>

      <label>
        Local
        <input id="localEvento" type="text" placeholder="Ex: Clínica X">
      </label>

      <label>
        Transporte
      
        <select id="transporteEvento">
           <option value="carro">🚗 Precisa de carro</option>
           <option value="carona">🚙 Vai de carona</option>
           <option value="casa">🏠 Em casa</option>
           <option value="a-pe">🚶 Vai a pé</option>
           <option value="publico">🚌 Transporte público</option>
           <option value="indefinido">❓ Ainda não definido</option>
        </select>
      </label>

      <label>
      Observação
    
      <textarea
        id="observacaoEvento"
        placeholder="Ex: Levar documento"
        rows="3"
      ></textarea>
    </label>

      <button id="salvarEvento">
        Adicionar evento
      </button>

  </main>

  <section id="telaFamilia" class="tela-familia escondido">

    <button id="voltarAgenda" class="botao-voltar-agenda">
      ← Voltar para agenda
    </button>
  
    <h2>Nossa Família</h2>
  
    <div class="opcoes-familia">
  
      <button id="abrirPessoas" class="opcao-familia">
         <span>👨‍👩‍👧‍👦</span>
         <strong>Pessoas</strong>
      </button>
  
      <button class="opcao-familia">
         <span>🛒</span>
         <strong>Lista de compras</strong>
      </button>
  
      <button class="opcao-familia">
         <span>🍽️</span>
         <strong>Cardápio</strong>
      </button>
  
    </div>

    <div id="areaPessoas" class="area-pessoas escondido">

      <h3>Pessoas da família</h3>
    
      <button id="adicionarPessoa" class="botao-adicionar-pessoa">
        + Adicionar pessoa
      </button>
    
      <div id="listaPessoas" class="lista-pessoas">
      </div>
    
    </div>
  
  </section>

  <script type="module" src="/src/main.js"></script>

</body>
</html>
